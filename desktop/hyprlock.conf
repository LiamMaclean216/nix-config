source = /home/$USER/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path = $wallpaper
    blur_size = 6
    blur_passes = 3
    brightness = .45
}

shape {
    monitor =
    size = 980, 92
    color = rgba(12,16,20,.32)
    rounding = 28
    border_size = 1
    border_color = rgba(255,255,255,.14)
    position = 0, 64
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 1, 42
    color = rgba(255,255,255,.12)
    position = -162, 72
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 1, 42
    color = rgba(255,255,255,.12)
    position = 162, 72
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 1
    dots_rounding = 4
    dots_spacing = .5
    dots_fade_time = 300
    inner_color = rgba(12,16,20,.55)
    outer_color = rgba(255,255,255,.08)
    check_color = rgba(255,255,255,.14)
    fail_color = rgba(210,80,90,.55)
    font_color = $color7
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 4
    rounding = 24
    placeholder_text = <i>Password</i>
    fail_text = <b>Try again</b>
    fail_timeout = 300
    position = 0, 8
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%-I:%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 5
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%A, %B %-d</b>"
    color = $color4
    font_size = 28
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, 112
    halign = center
    valign = center
