# Palette, type, corners and animation duration come from desktop/theme.nix.
general {
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, @fadeSpeed@, soft
    animation = fadeOut, 1, @fadeSpeed@, soft
    animation = inputField, 1, @fadeSpeed@, soft
}

background {
    monitor =
    path = @WALLPAPER@
    color = rgb(@background@)
    blur_size = 8
    blur_passes = 3
    brightness = 0.48
    contrast = 0.90
    noise = 0.008
    vibrancy = 0.08
}

# A quiet clock with room for the wallpaper to breathe.
label {
    monitor =
    text = cmd[update:1000] date +"<span weight='light'>%-I:%M</span>"
    color = rgb(@foreground@)
    font_size = 96
    font_family = @font@
    position = 0, 192
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(@shadow@40)
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(@foreground@d9)
    font_size = 17
    font_family = @font@
    position = 0, 114
    halign = center
    valign = center
    zindex = 2
}

# One small sign-in surface, with a restrained warm edge highlight.
shape {
    monitor =
    size = 420, 166
    color = rgba(@background@e8)
    rounding = @radius@
    border_size = 1
    border_color = rgba(@accent@45) rgba(@secondary@12) 135deg
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(@shadow@55)
    position = 0, -64
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $USER
    color = rgb(@foreground@)
    font_size = 18
    font_family = @font@
    position = 0, -22
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 348, 52
    outline_thickness = 1
    inner_color = rgba(@sidebar@e6)
    outer_color = rgba(@foreground@20)
    check_color = rgba(@accent@a0) rgba(@secondary@70) 45deg
    fail_color = rgba(@error@b0)
    capslock_color = rgba(@accent@99)
    font_color = rgb(@foreground@)
    font_family = @font@
    dots_size = 0.18
    dots_rounding = -1
    dots_spacing = 0.35
    fade_on_empty = false
    rounding = @controlRadius@
    placeholder_text = <span foreground="##@muted@" size="14000">Password</span>
    check_text = <span size="14000">Unlocking…</span>
    fail_text = <span size="14000">Try again</span>
    position = 0, -88
    halign = center
    valign = center
    zindex = 2
}

