background {
    monitor =
    path = @WALLPAPER@
    blur_size = 8
    blur_passes = 4
    brightness = .65
    vibrancy = .12
}

shape {
    monitor =
    size = 980, 92
    color = rgba(@background@d9)
    rounding = @radius@
    border_size = 0
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000040)
    position = 0, 64
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 1, 42
    zindex = 1
    color = rgba(@foreground@1f)
    position = -162, 72
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 1, 42
    zindex = 1
    color = rgba(@foreground@1f)
    position = 162, 72
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = rgba(@background@e6)
    check_color = rgba(@muted@bb)
    fail_color = rgba(@error@8c)
    font_color = rgb(@foreground@)
    font_family = @font@
    fade_on_empty = false
    shadow_color = rgba(@shadow@80)
    shadow_passes = 2
    shadow_size = 4
    rounding = @radius@
    placeholder_text = Password
    fail_text = <b>Try again</b>
    position = 0, 8
    halign = center
    valign = center
}

label {
    zindex = 2
    monitor =
    text = cmd[update:1000] date +"<b>%-I:%M</b>"
    color = rgb(@foreground@)
    font_size = 120
    font_family = @font@
    shadow_passes = 0
    shadow_size = 5
    position = 0, 210
    halign = center
    valign = center
}

